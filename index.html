<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>イセログ 〜異世界文明開拓〜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c0a08;color:#f0e8d8;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;--ac:#e0a060}
#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:linear-gradient(#3b2a1a,#16100a)}
button{font:inherit;color:inherit}
.btn{background:linear-gradient(#5a4630,#3a2c1c);border:1px solid #a08050;border-radius:8px;padding:9px 14px;font-size:15px;color:#fff3d8;cursor:pointer;box-shadow:0 2px 0 #0008;min-height:40px}
.btn:active{transform:translateY(1px)}.btn.pri{background:linear-gradient(#b8862c,#7a5410);border-color:#ffd870;font-weight:bold}
.btn.sm{padding:5px 9px;font-size:13px;min-height:34px}.btn.dis,.dis{opacity:.4}
.btn.on{background:linear-gradient(#2c7a4c,#18502c);border-color:#80e0a0}
body.pad .foc{outline:3px solid #ffe060;outline-offset:2px;box-shadow:0 0 14px #ffe060;z-index:5;position:relative}
body.pad.grid .foc{outline:none;box-shadow:none}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.col{display:flex;flex-direction:column;gap:8px;align-items:center}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;background:radial-gradient(circle at 50% 30%,#3c6a3a,#0c140a 70%);position:relative;overflow:auto}
.ver{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;font-size:12px;display:flex;gap:6px;align-items:center;color:#d8c8a0}
.logo{font-size:clamp(44px,13vw,84px);font-weight:900;letter-spacing:.06em;background:linear-gradient(#fff8c0,#8ed070 55%,#2c7a3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000)}
.sub{font-size:13px;color:#cfe0b8;text-align:center}
.icons{font-size:26px;letter-spacing:6px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.menu{display:flex;flex-direction:column;gap:8px;width:min(300px,86vw)}
input.nm{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid #a08050;background:#1c140c;color:#fff;text-align:center;width:100%;user-select:text;-webkit-user-select:text}
.top{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#0009;font-size:13px;border-bottom:1px solid #fff2;flex:none}
.top .sp{flex:1}.top b{color:var(--ac)}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.pane{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.box{background:#0007;border:1px solid #fff2;border-radius:10px;padding:10px;width:min(680px,100%)}
.hd{font-size:17px;font-weight:bold;color:var(--ac);text-align:center}
.small{font-size:12px;color:#c8bca8}.wait{color:#ffd870;font-size:13px;text-align:center;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.5}}
.party{display:flex;gap:5px;padding:4px 6px;justify-content:center;flex:none;flex-wrap:wrap;width:100%}
.chip{display:flex;gap:5px;align-items:center;background:#000a;border:1px solid #fff3;border-radius:8px;padding:3px 6px;min-width:0;flex:1 1 0;max-width:190px;cursor:pointer;position:relative}
.chip.me{border-color:#ffe060;box-shadow:0 0 6px #ffe06080}.chip.down{filter:grayscale(1);opacity:.75}
.pe{font-size:24px;line-height:1}.pi{flex:1;min-width:0}.pn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:11px;background:#400;border-radius:6px;position:relative;overflow:hidden;border:1px solid #0008}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#f06050,#b02020);transition:width .3s}
.bar b{position:absolute;inset:0;font-size:9px;line-height:10px;text-align:center;font-weight:normal;text-shadow:0 0 2px #000}
.bar.ps{height:5px;background:#443a10;margin-top:1px}.bar.ps i{background:#f2c230}
/* 戦闘：戦場(canvas)を全面に敷き、上下にUIを重ねる */
.cb{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.cb canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cbt,.cbb{position:relative;z-index:1;flex:none}.cbs{flex:1;min-height:90px;pointer-events:none}
.cbb{background:linear-gradient(transparent,#000c 22px);padding-top:6px}
.fctl{position:relative;z-index:1;flex:none;display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:6px 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none}.fctl .btn{pointer-events:auto}
#mapcv{border:2px solid #a08050;border-radius:6px;image-rendering:pixelated}
.logl{font-size:11px;color:#f4ecd8;text-align:center;height:28px;overflow:hidden;padding:0 8px;line-height:14px;text-shadow:0 0 3px #000,0 0 3px #000}
.detail{min-height:44px;margin:2px 6px;padding:5px 8px;background:#000b;border:1px solid #fff2;border-radius:8px;font-size:12px;display:flex;gap:8px;align-items:center}
.detail .dt{flex:1}
.hand{display:flex;gap:4px;padding:8px 6px 4px;overflow-x:auto;justify-content:safe center;align-items:flex-end;min-height:112px}
.card{flex:none;width:clamp(62px,17.5vw,104px);height:clamp(92px,25vw,146px);border-radius:8px;border:2px solid #c8a868;background:linear-gradient(#f4e8c8,#d8c494);color:#2a1c0c;padding:3px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .12s;overflow:hidden}
.card.sel{transform:translateY(-10px);box-shadow:0 0 12px #fff8}.card.unus,.card.noen{filter:brightness(.6)}
.card.t-atk{border-color:#c84030}.card.t-def{border-color:#3878c8}.card.t-evd{border-color:#30a8a0}.card.t-sup{border-color:#d8a820}.card.t-heal{border-color:#38a848}.card.t-deb{border-color:#8848b8}.card.t-sp{border-color:#787878}.card.t-mov{border-color:#e07820}
.card.up .cn{color:#087018}
.cc{position:absolute;top:-1px;left:-1px;width:20px;height:20px;border-radius:0 0 8px 0;background:#2858b0;color:#fff;font-weight:bold;font-size:13px;line-height:20px;text-align:center}
.cn{font-size:clamp(9px,2.5vw,12px);font-weight:bold;margin:1px 0 0 18px;line-height:1.15;height:2.3em;overflow:hidden;align-self:stretch;text-align:center}
.ci{font-size:clamp(14px,4vw,22px);line-height:1.2}
.cd{font-size:clamp(8px,2.2vw,10.5px);line-height:1.2;text-align:center;overflow:hidden;flex:1}
.cr{font-size:8px;background:#2a1c0c;color:#f4e8c8;border-radius:4px;padding:0 4px;position:absolute;bottom:2px}
.ctl{display:flex;gap:6px;align-items:center;padding:4px 8px calc(6px + env(safe-area-inset-bottom));flex-wrap:wrap;justify-content:flex-end}
.orb{width:42px;height:42px;border-radius:50%;background:radial-gradient(#80c8ff,#1848a0);border:2px solid #c0e0ff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;flex:none}
.grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.eq{width:min(230px,46vw);background:#1c1610;border:2px solid #48b060;border-radius:10px;padding:6px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.eq.sel{box-shadow:0 0 12px #fff8;transform:translateY(-3px);border-color:#ffd870}
.eq .en{font-size:13px;font-weight:bold}.eq .em{font-size:26px;float:left;margin-right:5px;line-height:1}.eq .ed{color:#e8e0d0;line-height:1.3}
#ov{position:fixed;inset:0;z-index:50;display:none;background:#000c;align-items:center;justify-content:center;padding:10px}
#ov.show{display:flex}
.dlg{background:#1e1810;border:2px solid #a08050;border-radius:12px;width:min(720px,100%);max-height:94dvh;display:flex;flex-direction:column}
.dlg .dh{padding:8px 12px;font-weight:bold;font-size:16px;color:#ffd870;border-bottom:1px solid #fff2;display:flex;align-items:center;gap:8px}.dlg .dh .sp{flex:1}
.dlg .db{padding:10px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;align-items:center}
.help{font-size:13px;line-height:1.7;align-self:stretch}.help b{color:#ffd870}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.ts{background:#000d;border:1px solid #ffd870;border-radius:8px;padding:8px 14px;font-size:13px;animation:tf 3.2s forwards;max-width:100%}
@keyframes tf{0%{opacity:0;transform:translateY(8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
.banner{position:fixed;left:0;right:0;top:30%;z-index:40;text-align:center;font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 12px #000,0 3px 0 #000;pointer-events:none;animation:bn 1.3s forwards;background:linear-gradient(90deg,transparent,#000a,transparent);padding:10px}
@keyframes bn{0%{opacity:0;transform:scaleX(1.6)}15%,70%{opacity:1;transform:none}100%{opacity:0}}
.tabs{display:flex;gap:4px;padding:5px 6px;justify-content:center;flex-wrap:wrap;flex:none;background:#0006}.tabs .btn{padding:5px 6px;font-size:12px}.dim{opacity:.55}
.it{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #fff1;align-self:stretch;flex-wrap:wrap}.it:first-of-type{border-top:none}.it .tx{flex:1;min-width:150px;font-size:13px;line-height:1.5}.it .tx b{color:#ffe9b0}
.pg{height:12px;background:#222;border-radius:6px;overflow:hidden;border:1px solid #0008;align-self:stretch;position:relative}.pg i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#80d0ff,#3070c0)}
.ng{color:#ff8060}
.chs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chb{width:min(150px,44vw);padding:8px 4px;text-align:center}.chb .pe{font-size:34px}
@media (orientation:landscape) and (max-height:520px){.hand{min-height:92px;padding-top:4px}.card{width:74px;height:90px}.ci{display:none}.cd{font-size:8.5px}.logl{height:14px}.detail{min-height:28px;padding:2px 8px}.orb{width:36px;height:36px}.ctl{padding-top:0}.party{padding:2px 6px}.pe{font-size:20px}.top{padding:2px 8px}.btn.sm{min-height:28px;padding:3px 9px}.st2{display:none}.cbs{min-height:60px}
.cbt{width:54%}.cbb{position:absolute;right:0;top:0;bottom:0;width:46%;background:#000b;padding:2px 0 0;display:flex;flex-direction:column}.hand{flex:1;min-height:0;flex-wrap:wrap;overflow-y:auto;align-content:flex-start;justify-content:center}.logl{text-align:left}}
</style></head><body>
<div id="app"></div><div id="ov"></div><div id="toast"></div>

<script src="js/ui/view.js?v=0.13.0"></script>

</body></html>
